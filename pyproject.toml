[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Multimodal RAG pipeline — PDF ingestion, vector search, and answer generation"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3",
    "langsmith>=0.9",
    "langchain-chroma>=0.2",
    "langchain-community>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.3",
    "unstructured[all-docs]>=0.15",
    "python-dotenv>=1.0",
    "streamlit>=1.28",
    "pandas>=2.0",
    "pillow>=10.0",
    "plotly>=5.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "opencv-python-headless==5.0.0.93",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src", "config", "scripts"]
include = ["src.*", "config.*", "scripts.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
