# Secrets consumed by the Streamlit dashboard.
# `_merge_streamlit_secrets` (app/dashboard.py) copies these into os.environ
# before config.settings is imported, so API_BASE_URL overrides the
# localhost default on Streamlit Cloud.
#
# NOTE: Streamlit Cloud does NOT read .env (it is gitignored). The backend
# keys (GEMINI_API_KEY, HF_TOKEN, ...) live on Railway; the dashboard only
# needs the API URL.
API_BASE_URL = "https://multimodal-rag-api-production-0b65.up.railway.app"
